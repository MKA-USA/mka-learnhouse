name: MKA Prod Deploy

# Hourly batched prod deploy. The owner merges dev -> prod PRs manually at any
# time; merging does NOT deploy. Once an hour this workflow checks whether
# `prod` moved past the last deployed commit (git tag `prod-deployed`) and, if
# so, restarts the prod Coolify service (which rebuilds from `prod` on the VPS)
# and waits for health. This workflow never builds or pushes images and never
# merges PRs.
#
# NOTE: `schedule` triggers only fire for the workflow file on the DEFAULT
# branch (`dev`). This file must exist on `dev`; the job checks out `prod`
# explicitly so it always deploys what is on `prod`.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      urgent:
        description: "Deploy now, ignoring the PROD_FREEZE variable"
        type: boolean
        default: false
      force:
        description: "Redeploy even if prod HEAD equals the last deployed SHA"
        type: boolean
        default: false

permissions:
  contents: write # only needed to move the `prod-deployed` tag

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Check freeze
        id: freeze
        env:
          PROD_FREEZE: ${{ vars.PROD_FREEZE }}
          URGENT: ${{ inputs.urgent }}
        run: |
          if [ "$PROD_FREEZE" = "true" ] && [ "$URGENT" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PROD_FREEZE is true and this run is not urgent; skipping."
            echo "## Prod deploy skipped: PROD_FREEZE is on" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.freeze.outputs.skip != 'true'
        with:
          ref: prod
          fetch-depth: 0

      # The mka-wait-healthy action lives on the default branch and may not
      # exist on `prod` yet, so check out the workflow's own commit separately.
      - uses: actions/checkout@v7
        if: steps.freeze.outputs.skip != 'true'
        with:
          path: ci
          fetch-depth: 1
          persist-credentials: false

      - name: Compare prod HEAD with last deployed SHA
        id: plan
        if: steps.freeze.outputs.skip != 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          head_sha=$(git rev-parse HEAD)
          echo "head=${head_sha}" >> "$GITHUB_OUTPUT"
          tag_sha=$(git rev-parse -q --verify "refs/tags/prod-deployed^{commit}" || true)

          if [ -n "$tag_sha" ] && [ "$tag_sha" = "$head_sha" ] && [ "$FORCE" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "## Prod deploy: nothing to deploy (prod is at \`${head_sha}\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Prod deploy"
            echo
            echo "- Deploying: \`${head_sha}\`"
            if [ -z "$tag_sha" ]; then
              echo "- No \`prod-deployed\` tag found: treating as never deployed."
            else
              echo "- Last deployed: \`${tag_sha}\`"
              echo
              echo "### Commits since last deploy"
              echo '```'
              git log --oneline "${tag_sha}..${head_sha}"
              echo '```'
              if git diff --name-only "${tag_sha}..${head_sha}" | grep -q '^apps/api/migrations/'; then
                echo
                echo "> **Warning:** this range touches \`apps/api/migrations/**\`. Migrations run against real prod data on startup. Check the Coolify DB backup is recent."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restart prod service in Coolify
        if: steps.plan.outputs.deploy == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROD_SERVICE_UUID: ${{ secrets.COOLIFY_PROD_SERVICE_UUID }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/services/$COOLIFY_PROD_SERVICE_UUID/restart"

      - name: Wait for prod to become healthy
        if: steps.plan.outputs.deploy == 'true'
        uses: ./ci/.github/actions/mka-wait-healthy
        with:
          url: https://ilm.mkausa.org/api/v1/health

      - name: Move prod-deployed tag
        if: steps.plan.outputs.deploy == 'true'
        env:
          DEPLOYED_SHA: ${{ steps.plan.outputs.head }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f prod-deployed "$DEPLOYED_SHA"
          git push -f origin refs/tags/prod-deployed
          echo "- Marker \`prod-deployed\` moved to \`${DEPLOYED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Prod deploy failed"
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- The \`prod-deployed\` tag was NOT moved; the next run will retry."
            echo "- See DEPLOYMENT.md, section \"Rolling back\"."
            echo "- Coolify gives no build logs for compose services; check service status and the Service Startup log in the Coolify UI."
          } >> "$GITHUB_STEP_SUMMARY"
