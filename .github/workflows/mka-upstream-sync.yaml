name: MKA Upstream Sync

# Fork-only (mka- prefix). Merges learnhouse/learnhouse `dev` into our `dev` via a PR.
#
#   clean merge          -> PR (label upstream-sync); auto-merge unless the report script
#                           flags a sensitive category (then label needs-review, no auto-merge)
#   conflicts            -> Claude resolves them, PR labeled upstream-sync +
#                           ai-resolved + needs-review, NEVER auto-merged
#   AI unavailable/fails -> single issue "Upstream sync blocked by conflicts"
#                           labeled ready-for-agent; run still exits green
#
# TWO JOBS, split by trust:
#
#   merge   (UNPRIVILEGED)  checkout dev, merge upstream, run Claude on conflicts (this is where
#                           upstream code may execute: uv/bun/pytest). Holds the Anthropic key only
#                           inside the Claude step and a READ-ONLY GITHUB_TOKEN. No GitHub App
#                           secrets/token exist in this job. Output = artifact: a git bundle + a
#                           small status.json + conflicts list + AI summary text.
#   publish (PRIVILEGED)    needs: merge. Fresh checkout of dev (trusted code) only. Treats the
#                           artifact as UNTRUSTED DATA: imports the bundle as objects, verifies it
#                           is exactly a merge of the expected upstream commit, runs the report
#                           script from the trusted checkout (never from the merged tree), then
#                           mints the App token and pushes / opens the PR or issue. It never checks
#                           out, builds, or executes any file from the merged tree; git hooks are
#                           disabled (core.hooksPath=/dev/null).
#
# Triggers: only `schedule` and `workflow_dispatch` (no pull_request_target / issue_comment / etc.).
#
# Why a GitHub App token: pushes/PRs made with GITHUB_TOKEN do not trigger other workflows, so CI
# would never run on the PR and auto-merge would wait forever.
# Needed App permissions: Contents RW, Pull requests RW, Issues RW, Workflows RW (Workflows is
# required to push any commit that touches .github/workflows/**, which syncs routinely do).
# Secrets: MKA_SYNC_APP_ID, MKA_SYNC_APP_PRIVATE_KEY, ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN).
#
# The sync commit MUST stay a merge commit (never squash/rebase) so future syncs share a merge-base.

on:
  schedule:
    - cron: "0 14 * * 1,4" # Mon + Thu 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: mka-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: learnhouse/learnhouse
  BLOCKED_TITLE: Upstream sync blocked by conflicts

jobs:
  # ===========================================================================================
  merge:
    name: Merge upstream (unprivileged)
    # `schedule` only fires from the default branch; also refuse manual runs from other branches
    # so a branch edit of this file cannot reach the secrets.
    if: github.repository == 'MKA-USA/mka-learnhouse' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      HAS_AI: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream and decide
        id: fetch
        run: |
          set -euo pipefail
          cp .github/mka/upstream-conflict-prompt.md "$RUNNER_TEMP/prompt.md"
          git config user.name "mka-upstream-sync[bot]"
          git config user.email "mka-upstream-sync[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git config core.hooksPath /dev/null
          echo ".mka-resolution-summary.md" >> .git/info/exclude
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # --no-tags: never pull upstream release tags (cli-*/semver tags trigger publish workflows).
          git fetch --no-tags upstream dev
          git fetch --no-tags origin dev
          n=$(git rev-list --count origin/dev..upstream/dev)
          echo "Upstream is $n commit(s) ahead of origin/dev"
          if [ "$n" -eq 0 ]; then echo "ahead=false" >> "$GITHUB_OUTPUT"; else echo "ahead=true" >> "$GITHUB_OUTPUT"; fi
          echo "base_sha=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/dev)" >> "$GITHUB_OUTPUT"

      - name: Prepare branch and merge upstream/dev
        id: sync
        if: steps.fetch.outputs.ahead == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # read-only
        run: |
          set -uo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # Reuse the branch of an open upstream-sync PR rather than opening a duplicate.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev --label upstream-sync --state open \
            --json number,headRefName --limit 1 --jq '.[0] // empty | [(.number|tostring), .headRefName] | @tsv')
          reused="false"; branch=""
          if [ -n "$existing" ]; then
            IFS=$'\t' read -r _ branch <<< "$existing"
            case "$branch" in
              sync/*) reused="true" ;;
              *) echo "Open upstream-sync PR has unexpected branch '$branch'; not reusing"; branch="" ;;
            esac
          fi

          remote_tip=""
          if [ "$reused" = "true" ]; then
            git fetch --no-tags origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            remote_tip=$(git rev-parse HEAD)
            if ! git merge --no-ff --no-edit -m "Merge dev into $branch" origin/dev; then
              git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
              git merge --abort
              echo "Merging origin/dev into $branch conflicts; needs a human."
              out state devconflict; out branch "$branch"
              exit 0
            fi
          else
            branch="sync/upstream-$(date -u +%F)"
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              branch="$branch-$(date -u +%H%M)"
            fi
            git checkout -b "$branch" origin/dev
          fi
          out branch "$branch"; out remote_tip "$remote_tip"

          # NEVER squash/rebase: must be a true merge commit.
          if git merge --no-ff --no-edit -m "Merge upstream/dev (${UPSTREAM_REPO}) into dev" upstream/dev; then
            if [ -n "$remote_tip" ] && [ "$(git rev-parse HEAD)" = "$remote_tip" ]; then
              echo "Reused branch already contains everything; nothing to push."
              out state nochange
            else
              out state clean
            fi
            exit 0
          fi

          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          if [ ! -s "$RUNNER_TEMP/conflicts.txt" ]; then
            echo "::error::git merge failed without conflicts (see log above)"
            exit 1
          fi
          # Keep the conflicted state (no --abort): the resolver continues from it.
          echo "Conflicted files:"; cat "$RUNNER_TEMP/conflicts.txt"
          out state conflicted

      # ---- conflict path (upstream code may execute from here on; no privileged tokens exist) ----
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.sync.outputs.state == 'conflicted' && env.HAS_AI == 'true'
        with:
          bun-version: 1.4.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.sync.outputs.state == 'conflicted' && env.HAS_AI == 'true'
        with:
          python-version: "3.14" # keep in sync with api-tests.yaml / apps/api/pyproject.toml

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.sync.outputs.state == 'conflicted' && env.HAS_AI == 'true'

      - name: Build resolver prompt
        id: prompt
        if: steps.sync.outputs.state == 'conflicted' && env.HAS_AI == 'true'
        run: |
          set -euo pipefail
          delim="PROMPT_$(openssl rand -hex 12)"
          {
            echo "text<<$delim"
            cat "$RUNNER_TEMP/prompt.md"
            echo
            echo "## Context"
            echo "- Upstream ref: upstream/dev ($(git rev-parse --short upstream/dev)); base: origin/dev ($(git rev-parse --short origin/dev))"
            echo "- Write the resolution report to: $GITHUB_WORKSPACE/.mka-resolution-summary.md"
            echo "- Conflicted files:"
            sed 's/^/  - /' "$RUNNER_TEMP/conflicts.txt"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve conflicts with Claude
        id: ai
        if: steps.sync.outputs.state == 'conflicted' && env.HAS_AI == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # read-only on purpose
          prompt: ${{ steps.prompt.outputs.text }}
          # The tool allow/deny lists are BEST-EFFORT only (uv/bun/pytest still execute upstream code
          # and prompt injection via upstream content is possible). The real control is job isolation:
          # this job has no write token and no GitHub App credentials, and its output is consumed by
          # the `publish` job as untrusted data after tree-level verification.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git log:*),Bash(git show:*),Bash(git checkout:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(uv lock:*),Bash(uv sync:*),Bash(uv run pytest:*),Bash(bun install --ignore-scripts:*),Bash(bun run lint:*),Bash(bunx tsc:*)"
            --disallowedTools "Bash(git push:*),Bash(gh:*),Bash(git merge --abort:*),Bash(git reset:*),Bash(git rebase:*),Bash(curl:*),Bash(wget:*),Bash(env:*),Bash(printenv:*)"

      - name: Decide outcome
        id: decide
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          STATE: ${{ steps.sync.outputs.state }}
          AI_OUTCOME: ${{ steps.ai.outcome }}
        run: |
          set -uo pipefail
          # final: nochange | clean | ai-resolved | blocked
          final=""; reason=""
          case "$STATE" in
            clean) final=clean ;;
            nochange|"") final=nochange ;;
            devconflict) final=blocked; reason="merging origin/dev into the existing sync PR branch conflicts" ;;
            conflicted)
              if [ "$HAS_AI" != "true" ]; then
                final=blocked; reason="no ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN secret configured"
              elif [ "$AI_OUTCOME" != "success" ]; then
                final=blocked; reason="the Claude conflict-resolution step failed (outcome: $AI_OUTCOME)"
              else
                # Finish the merge if the agent staged everything but did not commit.
                if [ -f .git/MERGE_HEAD ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                  git commit --no-edit || true
                fi
                if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                  final=blocked; reason="unresolved conflicts remain"
                elif [ -f .git/MERGE_HEAD ]; then
                  final=blocked; reason="merge was not committed"
                elif ! git merge-base --is-ancestor upstream/dev HEAD || ! git merge-base --is-ancestor origin/dev HEAD; then
                  final=blocked; reason="result is not a merge that contains both origin/dev and upstream/dev"
                elif [ -s "$RUNNER_TEMP/conflicts.txt" ] && \
                     xargs -a "$RUNNER_TEMP/conflicts.txt" -d '\n' git grep -lE '^(<<<<<<<|>>>>>>>) ' -- 2>/dev/null | grep -q .; then
                  final=blocked; reason="conflict markers remain in resolved files"
                else
                  # Lockfile regeneration / metadata edits left uncommitted after the merge commit.
                  if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
                    git add -u
                    git commit -m "chore: regenerate lockfiles after upstream merge"
                  fi
                  final=ai-resolved
                fi
              fi
              ;;
          esac
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "final=$final reason=$reason"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Package result
        id: package
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          AHEAD: ${{ steps.fetch.outputs.ahead }}
          FINAL: ${{ steps.decide.outputs.final }}
          REASON: ${{ steps.decide.outputs.reason }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          REMOTE_TIP: ${{ steps.sync.outputs.remote_tip }}
          BASE_SHA: ${{ steps.fetch.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          state="${FINAL:-}"
          [ "$AHEAD" = "false" ] && state="none"
          [ -z "$state" ] && state="blocked" && REASON="merge job did not reach a decision"
          if [ "$state" = "clean" ] || [ "$state" = "ai-resolved" ]; then
            args=(HEAD "^$BASE_SHA" "^$UPSTREAM_SHA")
            [ -n "$REMOTE_TIP" ] && args+=("^$REMOTE_TIP")
            git bundle create out/sync.bundle "${args[@]}"
          fi
          [ -s "$RUNNER_TEMP/conflicts.txt" ] && cp "$RUNNER_TEMP/conflicts.txt" out/conflicts.txt || true
          [ -s .mka-resolution-summary.md ] && head -c 30000 .mka-resolution-summary.md > out/summary.md || true
          jq -n --arg state "$state" --arg reason "$REASON" --arg branch "$BRANCH" \
                --arg base "$BASE_SHA" --arg upstream "$UPSTREAM_SHA" --arg tip "$REMOTE_TIP" \
            '{state:$state, reason:$reason, branch:$branch, base_sha:$base, upstream_sha:$upstream, remote_tip:$tip}' > out/status.json
          cat out/status.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: sync-result
          path: out/
          if-no-files-found: error
          retention-days: 3


  # ===========================================================================================
  publish:
    name: Publish PR or issue (privileged, trusted code only)
    needs: merge
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GIT_ATTR_NOSYSTEM: "1"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      # Trusted code only: the commit of THIS workflow run (dev). NEVER the merged tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sync-result
          path: ${{ runner.temp }}/result

      # The artifact is UNTRUSTED. Everything below recomputes what the result must look like from
      # origin/dev + the upstream SHA and refuses (blocked issue) anything that deviates:
      #   * bundle = exactly one ref (HEAD); commits = exactly {merge of upstream [+ one regen commit]
      #     [+ one "merge dev into branch" commit]}, no extra history
      #   * clean: tree == pure merge-tree result
      #   * ai-resolved: tree may differ from the pure merge ONLY in files that conflicted in OUR OWN
      #     merge-tree run (+ regenerated lockfiles of conflicted manifests, upstream-modifications.md,
      #     new alembic revisions); nothing under .github/, scripts/, Docker or other files that run
      #     in CI with secrets may be changed by the AI, and a conflict there blocks the sync.
      - name: Verify artifact (treated as untrusted data)
        id: verify
        env:
          GH_TOKEN: ${{ github.token }} # read-only
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          fail() { echo "::error::$1"; exit 1; }
          # Nothing repo-controlled may run: no hooks, no attribute-selected drivers/filters, no fsmonitor,
          # no submodule recursion. The candidate is never checked out (plumbing + object fetches only).
          git config core.hooksPath /dev/null
          git config core.attributesFile /dev/null
          git config core.fsmonitor false
          git config fetch.recurseSubmodules false
          git config submodule.recurse false
          git config user.name "mka-upstream-sync[bot]"
          git config user.email "mka-upstream-sync[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream dev
          git fetch --no-tags origin dev

          res="$RUNNER_TEMP/result"
          state=$(jq -r '.state' "$res/status.json")
          branch=$(jq -r '.branch' "$res/status.json")
          base_sha=$(jq -r '.base_sha' "$res/status.json")
          up_sha=$(jq -r '.upstream_sha' "$res/status.json")
          remote_tip=$(jq -r '.remote_tip // ""' "$res/status.json")
          reason=$(jq -r '.reason' "$res/status.json" | tr -cd '[:print:]' | head -c 200)

          case "$state" in none|nochange|clean|ai-resolved|blocked) ;; *) fail "bad state" ;; esac
          out state "$state"; out reason "$reason"
          if [ "$state" = "none" ] || [ "$state" = "nochange" ]; then exit 0; fi

          # Conflict list from the artifact: display-only (sanitized). Trust decisions use our own computation below.
          : > "$RUNNER_TEMP/conflicts.safe"
          if [ -s "$res/conflicts.txt" ]; then
            grep -E '^[][A-Za-z0-9._/@()+ -]{1,300}$' "$res/conflicts.txt" | head -200 > "$RUNNER_TEMP/conflicts.safe" || true
          fi
          [[ "$up_sha" =~ ^[0-9a-f]{40}$ ]] || fail "bad upstream sha"
          out up_sha "$up_sha"
          if [ "$state" = "blocked" ]; then exit 0; fi

          # ---- clean / ai-resolved ----
          [[ "$branch" =~ ^sync/[A-Za-z0-9._-]+$ ]] || fail "bad branch name"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || fail "bad base sha"
          [[ -z "$remote_tip" || "$remote_tip" =~ ^[0-9a-f]{40}$ ]] || fail "bad remote tip"
          git merge-base --is-ancestor "$base_sha" origin/dev || { echo "::warning::base not in dev history; skipping"; out state skip; exit 0; }
          git merge-base --is-ancestor "$up_sha" upstream/dev || fail "upstream sha not in upstream/dev"

          # The branch on GitHub must be exactly what the merge job started from (nobody pushed meanwhile).
          cur_tip=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ "$cur_tip" != "$remote_tip" ]; then
            echo "::warning::branch $branch moved since the merge job ran; skipping, next run re-evaluates"
            out state skip; exit 0
          fi
          if [ -n "$remote_tip" ]; then git fetch --no-tags origin "$branch"; fi

          # ---- bundle shape: exactly one ref (HEAD), no tags/extra refs ----
          bundle="$res/sync.bundle"
          heads=$(git bundle list-heads "$bundle")
          [ "$(printf '%s\n' "$heads" | wc -l)" -eq 1 ] && [[ "$heads" =~ ^[0-9a-f]{40}\ HEAD$ ]] || fail "bundle must contain exactly one ref (HEAD)"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" '+HEAD:refs/mka/candidate'
          cand=$(git rev-parse refs/mka/candidate)

          # ---- commit shape: cand = M [+R]; M = merge(P1, upstream); P1 = base | remote_tip | merge(remote_tip, base) ----
          parent2() { git rev-parse -q --verify "$1^2" || true; }
          nparents() { git rev-list --parents -n1 "$1" | wc -w | awk '{print $1-1}'; }
          if [ "$(parent2 "$cand")" = "$up_sha" ]; then
            m="$cand"
          else
            [ "$state" = "ai-resolved" ] && [ "$(nparents "$cand")" -eq 1 ] || fail "unexpected candidate shape"
            m=$(git rev-parse "$cand^1")
            [ "$(parent2 "$m")" = "$up_sha" ] || fail "no merge of the upstream sha under candidate"
          fi
          [ "$(nparents "$m")" -eq 2 ] || fail "merge commit must have two parents"
          p1=$(git rev-parse "$m^1")
          want="$cand"$'\n'"$m"
          if [ -z "$remote_tip" ]; then
            [ "$p1" = "$base_sha" ] || fail "fresh sync must merge upstream directly onto origin/dev"
          elif [ "$p1" != "$remote_tip" ]; then
            [ "$(nparents "$p1")" -eq 2 ] && [ "$(git rev-parse "$p1^1")" = "$remote_tip" ] && [ "$(parent2 "$p1")" = "$base_sha" ] \
              || fail "unexpected first parent on reused branch"
            t=$(git merge-tree --write-tree --no-messages "$remote_tip" "$base_sha") \
              && [ "$t" = "$(git rev-parse "$p1^{tree}")" ] || fail "dev merge into branch is not a pure merge"
            want="$want"$'\n'"$p1"
          fi
          args=("$cand" "^$base_sha" "^$up_sha"); [ -n "$remote_tip" ] && args+=("^$remote_tip")
          [ "$(git rev-list "${args[@]}" | sort -u)" = "$(printf '%s\n' "$want" | sort -u)" ] || fail "candidate contains unexpected extra commits"

          # ---- trusted recomputation of the merge + path policy (NUL-delimited parsing, python, trusted checkout) ----
          cand_tree=$(git rev-parse "$cand^{tree}")
          python3 scripts/mka/upstream-sync-verify-diff.py --p1 "$p1" --up "$up_sha" --cand-tree "$cand_tree" \
            --mode "$state" --out-dir "$RUNNER_TEMP" > "$RUNNER_TEMP/diffcheck.out" || fail "candidate tree does not match the trusted merge"
          verdict=$(sed -n 's/^verdict=//p' "$RUNNER_TEMP/diffcheck.out" | head -1)
          dreason=$(sed -n 's/^reason=//p' "$RUNNER_TEMP/diffcheck.out" | head -1 | tr -cd '[:print:]' | head -c 200)
          case "$verdict" in
            ok) ;;
            blocked) out state blocked; out reason "$dreason"; exit 0 ;;
            *) fail "bad verifier verdict" ;;
          esac

          # ---- sticky-review input: is everything already on the reused branch a verified pure merge? ----
          dirty=false
          if [ -n "$remote_tip" ]; then
            while read -r c p1x p2x extra; do
              if [ -z "$p2x" ] || [ -n "$extra" ]; then dirty=true; break; fi
              t=$(git merge-tree --write-tree --no-messages "$p1x" "$p2x") || { dirty=true; break; }
              [ "$t" = "$(git rev-parse "$c^{tree}")" ] || { dirty=true; break; }
            done < <(git rev-list --parents "$remote_tip" "^$base_sha" "^$up_sha")
          fi
          [ "$state" != "clean" ] || [ "$cand" = "$m" ] || fail "clean candidate must be the merge commit itself"
          out dirty "$dirty"; out candidate "$cand"; out branch "$branch"

      - name: Build report and review gate (no App token in this step)
        if: steps.verify.outputs.state == 'clean' || steps.verify.outputs.state == 'ai-resolved'
        env:
          UP_SHA: ${{ steps.verify.outputs.up_sha }}
          CAND: ${{ steps.verify.outputs.candidate }}
        run: |
          set -uo pipefail
          # Gate on the CUMULATIVE diff (origin/dev...candidate = everything the PR would land, including
          # earlier commits on a reused branch, AI edits, both sides of renames, modes and symlinks).
          # Commit list = upstream range only. Trusted checkout; fails safe (needs_review=true) on any error.
          if ! python3 scripts/mka/upstream-sync-report.py --base origin/dev --head "$UP_SHA" --gate-head "$CAND" \
                 --upstream-repo "$UPSTREAM_REPO" --github-output "$RUNNER_TEMP/gate.txt" > "$RUNNER_TEMP/report.md"; then
            printf '## Upstream sync\n\n**Report script crashed; full review required.**\n' > "$RUNNER_TEMP/report.md"
            printf 'needs_review=true\ncommit_count=0\n' > "$RUNNER_TEMP/gate.txt"
          fi

      - name: Create GitHub App token
        id: app
        if: steps.verify.outcome == 'success' && steps.verify.outputs.state != 'skip'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.MKA_SYNC_APP_ID }}
          private-key: ${{ secrets.MKA_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Push branch and open or update PR
        if: steps.verify.outputs.state == 'clean' || steps.verify.outputs.state == 'ai-resolved'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          CAND: ${{ steps.verify.outputs.candidate }}
          DIRTY: ${{ steps.verify.outputs.dirty }}
          AI_RESOLVED: ${{ steps.verify.outputs.state == 'ai-resolved' }}
        run: |
          set -euo pipefail
          res="$RUNNER_TEMP/result"

          # Gate result comes from the "Build report" step (computed without the App token in the environment).
          needs_review=$(grep -h '^needs_review=' "$RUNNER_TEMP/gate.txt" | tail -1 | cut -d= -f2)
          commit_count=$(grep -h '^commit_count=' "$RUNNER_TEMP/gate.txt" | tail -1 | cut -d= -f2)
          [[ "$commit_count" =~ ^-?[0-9]+$ ]] || commit_count=0
          [ "$needs_review" = "false" ] || needs_review=true

          # Existing PR for this branch (trusted lookup). Review state is STICKY: once a PR has carried
          # needs-review or ai-resolved, later "clean" runs never turn auto-merge on for it.
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          sticky=false
          if [ -n "$pr_number" ]; then
            labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name')
            if printf '%s\n' "$labels" | grep -qxE 'ai-resolved|needs-review'; then sticky=true; fi
            # Disable auto-merge BEFORE pushing so new commits can never land through an earlier-armed auto-merge.
            gh pr merge "$pr_number" --disable-auto || true
          fi
          no_auto=false
          if [ "$needs_review" = "true" ] || [ "$AI_RESOLVED" = "true" ] || [ "$sticky" = "true" ] || [ "$DIRTY" = "true" ]; then no_auto=true; fi

          body="$RUNNER_TEMP/body.md"
          : > "$body"
          if [ "$AI_RESOLVED" = "true" ]; then
            {
              echo "> **AI-resolved merge conflicts. This PR is never auto-merged. Review every resolution below before merging (merge commit only).**"
              echo
              echo "## Conflict resolution summary (AI-written, unverified)"
              if [ -s "$res/summary.md" ]; then
                # Untrusted text: drop control chars, neutralize @mentions; only ever written to a body file.
                tr -d '\000-\010\013\014\016-\037' < "$res/summary.md" | sed 's/@/@\xe2\x80\x8b/g'
              else
                echo "_The resolver did not write a summary; inspect the merge commit diff._"
              fi
              echo
              echo "## Conflicted files (recomputed by the publish job)"
              cat "$RUNNER_TEMP/conflicts.md"
              echo
              echo "---"
              echo
            } >> "$body"
          fi
          if [ "$DIRTY" = "true" ] || [ "$sticky" = "true" ]; then
            echo "> Review is required: this branch already carries earlier review-flagged, AI-resolved or hand-pushed commits. Auto-merge stays off." >> "$body"
            echo >> "$body"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$body"
          printf '\n_Generated by `mka-upstream-sync` ([run](%s/%s/actions/runs/%s))._\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body"
          head -c 60000 "$body" > "$body.trunc" && mv "$body.trunc" "$body"   # PR body cap is 65536

          # Push the verified candidate object (plain push: no force). Hooks disabled; token only in this header.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null -c core.fsmonitor=false -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "refs/mka/candidate:refs/heads/${BRANCH}"

          gh label create upstream-sync --color 0e8a16 --description "Automated upstream (learnhouse/learnhouse) sync" --force
          gh label create needs-review --color d93f0b --description "Needs human review before merge" --force
          gh label create ai-resolved --color 5319e7 --description "Merge conflicts resolved by AI; never auto-merge" --force

          title="chore(sync): merge upstream learnhouse dev (${commit_count} commits, $(date -u +%F))"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "$title" --body-file "$body"
            pr="$pr_number"
          else
            url=$(gh pr create --base dev --head "$BRANCH" --title "$title" --body-file "$body" --label upstream-sync)
            pr=$(gh pr view "$url" --json number --jq .number)
          fi

          if [ "$AI_RESOLVED" = "true" ]; then
            gh pr edit "$pr" --add-label ai-resolved --add-label needs-review
          elif [ "$needs_review" = "true" ] || [ "$DIRTY" = "true" ]; then
            gh pr edit "$pr" --add-label needs-review
          fi

          if [ "$no_auto" = "true" ]; then
            gh pr merge "$pr" --disable-auto || true
            echo "Auto-merge not enabled for #$pr"
            exit 0
          fi
          # Only arm auto-merge if the PR head is exactly what we just pushed (nobody pushed in between),
          # and bind it to that commit.
          head_oid=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          if [ "$head_oid" != "$CAND" ]; then
            echo "::warning::PR head $head_oid != pushed $CAND; not enabling auto-merge"
            exit 0
          fi
          # --merge = merge commit (never squash/rebase). Waits for the required "MKA CI gate" check.
          gh pr merge "$pr" --auto --merge --match-head-commit "$CAND"

      - name: Open or update blocked-sync issue
        if: steps.verify.outputs.state == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REASON: ${{ steps.verify.outputs.reason }}
        run: |
          set -euo pipefail
          gh label create ready-for-agent --color 1d76db --description "Ready for an agent to pick up" --force
          files="(none recorded)"
          [ -s "$RUNNER_TEMP/conflicts.safe" ] && files=$(sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.safe")
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The scheduled upstream sync could not complete automatically."
            echo
            echo "**Reason:** $REASON"
            echo "**Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "**Upstream commits not yet in dev:** $(git rev-list --count origin/dev..upstream/dev)"
            echo
            echo "### Conflicted files"
            echo "$files"
            echo
            echo "### Reproduce locally"
            echo '```sh'
            echo "git config rerere.enabled true"
            echo "git remote add upstream https://github.com/${UPSTREAM_REPO}.git   # once"
            echo "git fetch --no-tags upstream dev && git fetch origin dev"
            echo "git checkout -b sync/upstream-manual origin/dev"
            echo "git merge --no-ff upstream/dev        # never squash/rebase"
            echo "# resolve: upstream as base + re-apply fork hooks per .codebase-memory/upstream-modifications.md"
            echo "# regenerate lockfiles: (cd apps/api && uv lock) ; (cd apps/web && bun install)"
            echo "git commit"
            echo "git push -u origin sync/upstream-manual   # open PR into dev, label upstream-sync, merge with a MERGE COMMIT"
            echo '```'
            echo
            echo "See the 'Syncing upstream' section of CLAUDE.md."
          } > "$body"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ready-for-agent \
            --search "in:title \"$BLOCKED_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$body"
            gh issue comment "$n" --body "Still blocked as of $(date -u +%F): $REASON ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          else
            gh issue create --title "$BLOCKED_TITLE" --label ready-for-agent --body-file "$body"
          fi
          echo "## Upstream sync blocked: $REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Close stale blocked-sync issue
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.state != 'blocked' && steps.verify.outputs.state != 'skip' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ready-for-agent \
            --search "in:title \"$BLOCKED_TITLE\"" --json number --jq '.[0].number // empty') || exit 0
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "Resolved by a later run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi
