name: MKA CI Gate

# Fork-only. Upstream CI workflows are path-filtered, so no single upstream check
# runs on every PR and none can be a *required* status check (a required check
# that never reports blocks the PR forever). This always-running job waits for
# every other check on the PR head commit and passes only if none failed.
# "MKA CI gate" is the only required check in the branch rulesets.
#
# Plain `pull_request` trigger: no secrets, read-only token. The ruleset pins the required check to the
# GitHub Actions app (integration_id 15368), so another app cannot post a passing "MKA CI gate".
# Note: a PR runs the gate workflow file from its own merge ref, so a PR that edits this file can weaken
# it; that is why .github/** changes are always flagged needs-review in sync PRs and should need review
# in human PRs (add CODEOWNERS for .github/ if you want it enforced).

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: mka-ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: MKA CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for all other checks on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # The ONLY exemptions, matched on identity not just name:
          #  - this very run's own check (GitHub Actions app, details_url of this run id)
          #  - "Dispatch to Infrastructure Repo", only when it belongs to .github/workflows/notify-infra.yaml
          #    (fails on this fork: no INFRA_REPO_PAT / vars.INFRA_REPO).
          # Every other check run, from any app, must be completed and non-failing.
          # Give path-filtered workflows time to register their check runs.
          sleep 90
          stable=0
          for _ in $(seq 1 130); do
            infra_runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/notify-infra.yaml") | .id') || { sleep 30; continue; }
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // ""), (.app.slug // ""), (.details_url // "")] | @tsv') || { sleep 30; continue; }
            pending=0; failed=""
            while IFS=$'\t' read -r name status conclusion app url; do
              [ -z "$name" ] && continue
              run_of_check=$(printf '%s' "$url" | sed -n 's#.*/actions/runs/\([0-9][0-9]*\)/.*#\1#p')
              if [ "$app" = "github-actions" ] && [ "$run_of_check" = "$RUN_ID" ]; then continue; fi
              if [ "$app" = "github-actions" ] && [ "$name" = "Dispatch to Infrastructure Repo" ] \
                 && [ -n "$run_of_check" ] && printf '%s\n' "$infra_runs" | grep -qx "$run_of_check"; then continue; fi
              if [ "$status" != "completed" ]; then pending=$((pending + 1)); continue; fi
              case "$conclusion" in
                success|skipped|neutral) ;;
                *) failed="$failed\n- $name ($conclusion)" ;;
              esac
            done <<< "$runs"
            if [ -n "$failed" ]; then
              printf 'Failing checks:%b\n' "$failed"
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              stable=$((stable + 1))
              if [ "$stable" -ge 2 ]; then echo "All other checks passed."; exit 0; fi
            else
              stable=0
            fi
            sleep 30
          done
          echo "Timed out waiting for checks"; exit 1
