name: Secret Scan

# Scans only the commits introduced by the PR/push with gitleaks (binary installed directly:
# gitleaks-action needs a paid license for org repos) and rejects forbidden paths.
on:
  pull_request:
  push:
    branches: [dev, prod, main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          # New branch / unreachable base (force push): scan only the last commit.
          if [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head~1"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # Use the scanner config/script from the base commit so a PR cannot loosen its own scan.
      # Falls back to the working copy when the base predates these files (first rollout).
      - name: Load trusted scanner config
        run: |
          base="${{ steps.range.outputs.base }}"
          git show "$base:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml" 2>/dev/null || cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          git show "$base:scripts/check-forbidden-paths.sh" > "$RUNNER_TEMP/check-forbidden-paths.sh" 2>/dev/null || cp scripts/check-forbidden-paths.sh "$RUNNER_TEMP/check-forbidden-paths.sh"

      - name: Reject forbidden paths
        run: |
          git diff --name-only --diff-filter=ACMR "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
            | sh "$RUNNER_TEMP/check-forbidden-paths.sh"

      - name: Scan commits for secrets
        run: |
          gitleaks git --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner \
            --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}"
